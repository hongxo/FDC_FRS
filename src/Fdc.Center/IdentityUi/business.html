<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDC/FRS · Dữ liệu theo trạm</title><link rel="stylesheet" href="styles/axl-base.css">
<link rel="stylesheet" href="styles/live-management.css"><script type="module" src="business.mjs"></script></head>
<body><main class="management-content"><a href="/identity/">Danh tính và phân quyền</a>
<h1>Dữ liệu theo trạm</h1><p>Máy chủ kiểm tra quyền riêng cho từng mục. Màn hình này chỉ đọc.</p>
<nav id="business-navigation" class="management-tabs" aria-label="Phân hệ" hidden>
<button type="button" data-view="dashboard">Tổng quan</button><button type="button" data-view="stations">Trạm</button>
<button type="button" data-view="ieds">IED</button><button type="button" data-view="records">COMTRADE</button>
<button type="button" data-view="collectors">Collector</button>
<button type="button" data-view="lab">Thử nghiệm mô phỏng</button>
<button type="button" data-view="bindings">Yêu cầu binding</button>
</nav><p id="status" role="status">Chọn phân hệ để tải dữ liệu.</p><div id="filters" hidden><label for="business-search">Tìm theo tên hoặc mã</label>
<input id="business-search" maxlength="80" autocomplete="off">
<fieldset id="record-filters" hidden><legend>Lọc bản ghi COMTRADE</legend>
<p id="record-ied-label">Tất cả IED trong phạm vi.</p>
<p>Để chọn IED, mở chi tiết IED và chọn “Xem bản ghi của IED”.</p>
<label for="record-from">Thu thập từ (UTC, bao gồm)</label><input id="record-from" type="datetime-local" step="1">
<label for="record-to">Thu thập đến trước (UTC)</label><input id="record-to" type="datetime-local" step="1">
<button id="record-clear" type="button">Bỏ bộ lọc COMTRADE</button></fieldset>
<button type="button" id="business-find">Tìm</button><button type="button" id="business-first" disabled>Đầu</button>
<button type="button" id="business-prev" disabled>Trước</button>
<button type="button" id="business-next" disabled>Sau</button><button type="button" id="business-last" disabled>Cuối</button>
<span id="business-count" aria-live="polite"></span></div>
<ul id="results"></ul><section id="object-detail" aria-label="Chi tiết" aria-live="polite"></section>
</main></body></html>
